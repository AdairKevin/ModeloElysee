    <!-- Todos los textos se editan en contenido.json; aquí solo van variables -->
    <template id="plantilla">
      <!-- 1. SOBRE DE BIENVENIDA: el sello abre el sobre y la tarjeta sube -->
      <div class="envelope-screen" id="envelopeScreen">
        <p class="sobre-encabezado">{{sobre.encabezado}}</p>
        <div class="envelope" id="sobre">
          <div class="sobre-fondo"></div>
          <div class="sobre-tarjeta">
            <span class="tarjeta-iniciales">{{sobre.inicial1}}<i>{{sobre.inicial2}}</i></span>
            <span class="tarjeta-nombres">{{sobre.remitente}}</span>
          </div>
          <div class="sobre-bolsillo"></div>
          <div class="envelope-flap"><div class="solapa-forro"></div></div>
          <button class="wax-seal" id="openEnvelope" aria-label="{{sobre.botonAria}}">
            <span>{{sobre.inicial1}}<i>{{sobre.inicial2}}</i></span>
          </button>
        </div>
        <p class="envelope-hint">{{sobre.instruccion}}</p>
      </div>

      <main class="content hidden" id="invitationContent">
        <!-- 2. PORTADA: marco de moldura, monograma y nombres -->
        <section class="section-home">
          <div class="marco">
            <svg class="marco-esquina tl"><use href="#esquina" /></svg>
            <svg class="marco-esquina tr"><use href="#esquina" /></svg>
            <svg class="marco-esquina bl"><use href="#esquina" /></svg>
            <svg class="marco-esquina br"><use href="#esquina" /></svg>
          </div>
          <div class="home-title">
            <div class="monograma">
              <svg class="monograma-corona"><use href="#corona" /></svg>
              <span class="monograma-letras">{{sobre.inicial1}}<i>{{sobre.inicial2}}</i></span>
            </div>
            <p class="home-evento etiqueta">{{portada.antetitulo}}</p>
            <h1 class="nombres-reveal">
              <span class="nombre">{{portada.nombre1}}</span>
              <em class="conector">{{portada.conector}}</em>
              <span class="nombre">{{portada.nombre2}}</span>
            </h1>
            <p class="home-invita">{{portada.invitacion}}</p>
            <div class="home-fecha">
              <span></span>
              <p>{{portada.fecha}}</p>
              <span></span>
            </div>
            <p class="home-ciudad etiqueta">{{portada.ciudad}}</p>
          </div>
          <a class="home-bajar" href="#editorial" aria-label="{{portada.bajarAria}}"><span></span></a>
        </section>

        <!-- EDITORIAL: foto principal con tratamiento de revista -->
        {{#editorial}}
        <section class="section-editorial" id="editorial">
          <figure class="editorial-foto" data-revelar>
            <img class="home-img" src="{{editorial.foto}}" alt="{{editorial.fotoAlt}}" />
            <figcaption>
              <span>{{editorial.numero}}</span>
              <span>{{editorial.seccion}}</span>
            </figcaption>
          </figure>
          <div class="editorial-texto" data-revelar>
            <h2 class="titulo-seccion">{{editorial.titulo}}</h2>
            <p>{{editorial.texto}}</p>
          </div>
        </section>
        {{/editorial}}

        <!-- 3. MÚSICA -->
        {{#musica}}
        <section class="section-music">
          <div class="music-card" data-revelar>
            <p class="etiqueta">{{musica.etiqueta}}</p>
            <div class="song-title">{{musica.cancion}}</div>
            <div class="artist-name">{{musica.artista}}</div>
            <button class="play-button" id="playPauseBtn" aria-label="{{musica.botonAria}}">
              <span class="icono-play"></span>
            </button>
            <div class="progress-container">
              <div class="progress" id="progressBar"></div>
            </div>
            <audio id="music" loop preload="none" src="{{musica.archivo}}"></audio>
          </div>
        </section>
        {{/musica}}

        <!-- 4. PALABRAS / DEDICATORIA -->
        {{#dedicatoria}}
        <section class="section-palabras">
          <svg class="separador"><use href="#separador" /></svg>
          <blockquote data-revelar>
            <p>{{dedicatoria.texto}}</p>
            <small>{{dedicatoria.firma}}</small>
          </blockquote>
        </section>
        {{/dedicatoria}}

        <!-- 5. INFO FORMAL -->
        {{#invitacion}}
        <section class="section-info">
          <p class="etiqueta" data-revelar>{{invitacion.antetitulo}}</p>
          <h2 class="titulo-seccion" data-revelar>{{invitacion.titulo}}</h2>
          <div class="familias">
            {{#invitacion.familia}}
            <div class="info-content" data-revelar>
              <b>{{titulo}}</b>
              <ul>
                {{#nombres}}<li>{{.}}</li>{{/nombres}}
              </ul>
            </div>
            {{/invitacion.familia}}
          </div>
          <div class="date-box" data-revelar>
            <span class="date-dia">{{invitacion.fecha.dia}}</span>
            <div class="date-centro">
              <span>{{invitacion.fecha.mes}}</span>
              <strong>{{invitacion.fecha.numero}}</strong>
              <span>{{invitacion.fecha.anio}}</span>
            </div>
            <span class="date-hora">{{invitacion.fecha.hora}}</span>
          </div>
        </section>
        {{/invitacion}}

        <!-- 6. CUENTA REGRESIVA (la fecha sale de evento.inicio) -->
        {{#cuentaRegresiva}}
        <section class="section-timer">
          <p class="etiqueta" data-revelar>{{cuentaRegresiva.antetitulo}}</p>
          <h2 class="titulo-seccion" data-revelar>{{cuentaRegresiva.titulo}}</h2>
          <ul class="date-time" data-revelar>
            <li><div class="time_number" id="dias">0</div><div class="time_txt">{{cuentaRegresiva.dias}}</div></li>
            <li><div class="time_number" id="horas">0</div><div class="time_txt">{{cuentaRegresiva.horas}}</div></li>
            <li><div class="time_number" id="minutos">0</div><div class="time_txt">{{cuentaRegresiva.minutos}}</div></li>
            <li><div class="time_number" id="segundos">0</div><div class="time_txt">{{cuentaRegresiva.segundos}}</div></li>
          </ul>
        </section>
        {{/cuentaRegresiva}}

        <!-- PROGRAMA DEL DÍA -->
        {{#programa}}
        <section class="section-programa">
          <p class="etiqueta" data-revelar>{{programa.antetitulo}}</p>
          <h2 class="titulo-seccion" data-revelar>{{programa.titulo}}</h2>
          <ol class="programa-lista">
            {{#programa.momentos}}
            <li data-revelar>
              <span class="programa-hora">{{hora}}</span>
              <span class="programa-punto"></span>
              <div>
                <b>{{actividad}}</b>
                <p>{{detalle}}</p>
              </div>
            </li>
            {{/programa.momentos}}
          </ol>
        </section>
        {{/programa}}

        <!-- 7. UBICACIONES -->
        {{#ubicaciones}}
        <section class="section-place">
          <p class="etiqueta" data-revelar>{{ubicaciones.antetitulo}}</p>
          <h2 class="titulo-seccion" data-revelar>{{ubicaciones.titulo}}</h2>
          <div class="place-grid">
            {{#ubicaciones.lugares}}
            <article class="place-card" data-revelar>
              <svg class="place-arco"><use href="#arco" /></svg>
              <p class="etiqueta">{{titulo}}</p>
              <h3>{{nombre}}</h3>
              <p class="place-hora">{{hora}}</p>
              <p class="place-dir">{{direccion}}</p>
              <a class="place-btn" href="{{mapa}}" target="_blank" rel="noopener">{{boton}}</a>
            </article>
            {{/ubicaciones.lugares}}
          </div>
        </section>
        {{/ubicaciones}}

        <!-- GALERÍA: tira editorial con desplazamiento -->
        {{#galeria}}
        <section class="section-slider">
          <p class="etiqueta" data-revelar>{{galeria.antetitulo}}</p>
          <h2 class="titulo-seccion" data-revelar>{{galeria.titulo}}</h2>
          <div class="slider-photo" id="galeria">
            {{#galeria.fotos}}
            <figure class="slide">
              <img class="img" src="{{foto}}" alt="{{alt}}" loading="lazy" />
              <figcaption><span>{{@numero}}</span> {{pie}}</figcaption>
            </figure>
            {{/galeria.fotos}}
          </div>
          <div class="galeria-puntos" id="galeriaPuntos">
            {{#galeria.fotos}}<button aria-label="{{alt}}" data-ir="{{@posicion}}"></button>{{/galeria.fotos}}
          </div>
        </section>
        {{/galeria}}

        <!-- 8. INFO ADICIONAL -->
        <section class="section-info-adicional">
          {{#vestimenta}}
          <div class="info-block" data-revelar>
            <p class="etiqueta">{{vestimenta.antetitulo}}</p>
            <h2 class="titulo-seccion">{{vestimenta.titulo}}</h2>
            <p class="info-codigo">{{vestimenta.codigo}}</p>
            <p>{{vestimenta.texto}}</p>
            {{?vestimenta.colores}}
            <ul class="paleta">
              {{#vestimenta.colores}}<li><span style="background: {{color}}"></span>{{nombre}}</li>{{/vestimenta.colores}}
            </ul>
            {{/vestimenta.colores}}
          </div>
          {{/vestimenta}}
          {{#vestimenta}}{{#regalos}}<svg class="separador info-separator"><use href="#separador" /></svg>{{/regalos}}{{/vestimenta}}
          {{#regalos}}
          <div class="info-block" data-revelar>
            <p class="etiqueta">{{regalos.antetitulo}}</p>
            <h2 class="titulo-seccion">{{regalos.titulo}}</h2>
            <p>{{regalos.texto}}</p>
            {{?regalos.opciones}}
            <ul class="regalos-lista">
              {{#regalos.opciones}}<li><b>{{nombre}}</b><span>{{detalle}}</span></li>{{/regalos.opciones}}
            </ul>
            {{/regalos.opciones}}
          </div>
          {{/regalos}}
        </section>

        <!-- 9. CONFIRMACIÓN (RSVP por WhatsApp; el número va en confirmacion.whatsapp) -->
        {{#confirmacion}}
        <section class="section-message">
          <div class="rsvp-tarjeta" data-revelar>
            <svg class="marco-esquina tl"><use href="#esquina" /></svg>
            <svg class="marco-esquina tr"><use href="#esquina" /></svg>
            <svg class="marco-esquina bl"><use href="#esquina" /></svg>
            <svg class="marco-esquina br"><use href="#esquina" /></svg>
            <p class="rsvp-sigla">{{confirmacion.sigla}}</p>
            <h2 class="titulo-seccion">{{confirmacion.titulo}}</h2>
            <p class="rsvp-texto">{{confirmacion.texto}}</p>
            <form class="rsvp-form">
              <label><span>{{confirmacion.campoNombre}}</span><input name="nombre" type="text" required /></label>
              <label><span>{{confirmacion.campoAsistentes}}</span><input name="personas" type="number" min="1" required /></label>
              <label><span>{{confirmacion.campoMensaje}}</span><textarea name="mensaje" rows="2"></textarea></label>
              <button type="submit" class="rsvp-btn">{{confirmacion.boton}}</button>
            </form>
          </div>
        </section>
        {{/confirmacion}}

        <!-- CIERRE -->
        {{#cierre}}
        <section class="section-cierre">
          <img src="{{cierre.foto}}" alt="{{cierre.fotoAlt}}" loading="lazy" />
          <div class="cierre-texto" data-revelar>
            <p class="cierre-frase">{{cierre.frase}}</p>
            <p>{{cierre.texto}}</p>
            <span class="cierre-iniciales">{{sobre.inicial1}}<i>{{sobre.inicial2}}</i></span>
          </div>
        </section>
        {{/cierre}}

        <!-- 10. FOOTER -->
        <footer>
          <img class="footer-logo" src="./assets/img/mirai-isotipo.svg" alt="Mirai" />
          <p>
            {{footer.texto}}
            <a href="{{footer.link}}" target="_blank" rel="noopener">{{footer.marca}}</a>
          </p>
          <p class="footer-slogan">{{footer.slogan}}</p>
          <a class="footer-red" href="{{footer.instagram}}" target="_blank" rel="noopener">{{footer.usuario}}</a>
          <small>{{footer.anio}}</small>
        </footer>
      </main>

      <!-- Botón flotante de música -->
      {{#musica}}
      <button class="musica-flotante" id="musicaFlotante" aria-label="{{musica.botonAria}}"><span></span><span></span><span></span></button>
      {{/musica}}

      <script src="./assets/js/main.js"></script>
    </template>

    <script src="./assets/js/motor.js"></script>
  </body>
</html>
